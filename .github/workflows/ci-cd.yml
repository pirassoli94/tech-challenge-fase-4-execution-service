name: CI-CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/execution_service_test_db
      BILLING_SERVICE_URL: http://localhost:3001
      OS_SERVICE_URL: http://localhost:3000
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --coverageThreshold='{"global":{"statements":80,"lines":80}}'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-execution-service
          path: coverage/
      - run: docker build -t execution-service:${{ github.sha }} .

  deploy-kubernetes:
    name: Deploy Kubernetes
    needs: test-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuraÃ§Ã£o Kubernetes
        id: kube-check
        shell: bash
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG nÃ£o configurado. Deploy ignorado."
          fi

      - name: Configurar kubectl
        if: steps.kube-check.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

      - name: Aplicar manifestos
        if: steps.kube-check.outputs.configured == 'true'
        run: kubectl apply -f k8s/

      - name: Validar rollout
        if: steps.kube-check.outputs.configured == 'true'
        run: kubectl rollout status deployment/execution-service --timeout=120s

