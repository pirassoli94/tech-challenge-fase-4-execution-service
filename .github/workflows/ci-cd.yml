name: CI-CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/execution_service_test_db
      BILLING_SERVICE_URL: http://localhost:3001
      OS_SERVICE_URL: http://localhost:3000
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --coverageThreshold='{"global":{"statements":80,"lines":80}}'
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-execution-service
          path: coverage/
      - run: docker build -t execution-service:${{ github.sha }} .

  
  deploy-kubernetes:
    name: Deploy Kubernetes Local
    needs: test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, local-k8s]
    permissions:
      contents: read

    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: |
          docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { throw "Docker indisponivel" }

          kubectl config current-context
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes indisponivel" }

          kubectl get deployment execution-service -n tech-challenge
          if ($LASTEXITCODE -ne 0) { throw "Deployment nao encontrado" }

      - name: Construir imagem Docker
        run: |
          $imagem = "tech-challenge-fase-4-execution-service:${{ github.sha }}"
          docker build -t $imagem .
          if ($LASTEXITCODE -ne 0) { throw "Falha ao construir imagem" }

          docker save -o execution-service-deploy.tar $imagem
          if ($LASTEXITCODE -ne 0) { throw "Falha ao exportar imagem" }

          docker cp execution-service-deploy.tar desktop-control-plane:/root/execution-service-deploy.tar
          if ($LASTEXITCODE -ne 0) { throw "Falha ao copiar imagem" }

          docker exec desktop-control-plane ctr -n k8s.io images import /root/execution-service-deploy.tar
          if ($LASTEXITCODE -ne 0) { throw "Falha ao importar imagem" }

      - name: Atualizar Execution Service
        run: |
          kubectl set image deployment/execution-service "tech-challenge-fase-4-execution-service=tech-challenge-fase-4-execution-service:${{ github.sha }}" -n tech-challenge
          if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar Execution Service" }

      - name: Verificar atualizacao
        run: |
          kubectl rollout status deployment/execution-service -n tech-challenge --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "Falha no rollout do Execution Service" }
